<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 카카오톡 공유 시 완벽한 방명록 페이지 미리보기 설정 -->
    <meta property="og:title" content="방명록 작성 — 2026 연세대 디자인예술학부 졸업전시회">
    <meta property="og:description" content="제22회 졸업전시회 방명록에 따뜻한 축하의 메시지를 남겨주세요.">
    <title>GUESTBOOK — YVCD GRADUATION SHOW</title>

    <!-- 폰트 설정 -->
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Montserrat:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <!-- 폭죽 효과 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            /* 순백색 배경 */
            color: #111111;
            font-family: 'Montserrat', 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 1. 실제 방명록 사이트 위장 화면 */
        #invitation-screen {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            min-height: 100vh;
            padding: 45px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #111;
            padding-bottom: 18px;
            margin-bottom: 30px;
        }

        .site-brand {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #111;
        }

        .site-page {
            font-size: 12px;
            font-weight: 500;
            color: #666;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .guest-intro {
            margin-bottom: 30px;
        }

        .guest-intro h1 {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
            color: #111;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .guest-intro p {
            font-size: 13.5px;
            line-height: 1.7;
            color: #555;
            word-break: keep-all;
        }

        /* 방명록 입력 폼 위장 박스 */
        .fake-form-box {
            background: #f8f9fa;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .form-input-mock {
            width: 100%;
            height: 42px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 13px;
            color: #333;
            font-weight: 500;
        }

        .form-textarea-mock {
            width: 100%;
            height: 80px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 13px;
            color: #333;
            resize: none;
        }

        .btn-enter {
            background-color: #111111;
            color: #ffffff;
            border: none;
            padding: 18px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Montserrat', 'Noto Sans KR', sans-serif;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-enter:active {
            background-color: #333;
        }

        /* 2. [초특급 매운맛] 버튼 클릭 시 터지는 미친 놀리기 화면 (처음엔 숨김) */
        #prank-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ff0055;
            font-family: 'Black Han Sans', sans-serif;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 9999;
            animation: bgCrazy 0.25s infinite alternate;
        }

        @keyframes bgCrazy {
            0% {
                background-color: #ff0055;
                color: #fff;
            }

            33% {
                background-color: #ffe600;
                color: #000;
            }

            66% {
                background-color: #00ffff;
                color: #000;
            }

            100% {
                background-color: #7a00ff;
                color: #fff;
            }
        }

        @keyframes crazyShake {
            0% {
                transform: translate(6px, 6px) rotate(0deg) scale(1);
            }

            20% {
                transform: translate(-10px, 0px) rotate(-6deg) scale(1.12);
            }

            40% {
                transform: translate(6px, -6px) rotate(6deg) scale(0.92);
            }

            60% {
                transform: translate(-6px, 10px) rotate(-4deg) scale(1.08);
            }

            80% {
                transform: translate(10px, -4px) rotate(5deg) scale(0.98);
            }

            100% {
                transform: translate(-4px, -6px) rotate(-6deg) scale(1.1);
            }
        }

        .shake-text {
            font-size: 46px;
            line-height: 1.25;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.6);
            animation: crazyShake 0.12s infinite;
            word-break: keep-all;
        }

        .emoji-bomb {
            font-size: 38px;
            margin-bottom: 15px;
            animation: bounce 0.18s infinite alternate;
        }

        @keyframes bounce {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.35);
            }
        }

        .prank-desc {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 19px;
            font-weight: 800;
            background: #000;
            color: #fff;
            padding: 18px 24px;
            border-radius: 15px;
            margin-bottom: 25px;
            line-height: 1.5;
            word-break: keep-all;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            border: 3px solid #fff;
        }

        .btn-retry {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            background: #fff;
            color: #000;
            border: 4px solid #000;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <!-- [1단계] yvdgraduateshow 방명록 페이지 위장 화면 (흰색 바탕) -->
    <div id="invitation-screen">
        <div>
            <div class="site-header">
                <span class="site-brand">YVCD GRADUATION SHOW</span>
                <span class="site-page">GUESTBOOK</span>
            </div>

            <div class="guest-intro">
                <h1>졸업전시회 방명록</h1>
                <p>
                    연세대학교 미래캠퍼스 디자인예술학부 시각디자인학전공 제22회 졸업전시회를 방문해 주셔서 감사합니다. 축하와 격려의 메시지를 남겨주세요.
                </p>
            </div>

            <!-- 실제 방명록 입력 칸처럼 보이는 위장 폼 (황정민 맞춤형 자동 입력 연출) -->
            <div class="fake-form-box">
                <div class="form-group">
                    <label>작성자 이름</label>
                    <div class="form-input-mock"></div>
                </div>
                <div class="form-group">
                    <label>축하 메시지</label>
                    <textarea class="form-textarea-mock" readonly></textarea>
                </div>
            </div>
        </div>

        <button class="btn-enter" onclick="triggerPrank()">
            방명록 최종 등록 및 축하 메시지 전송
        </button>
    </div>

    <!-- [2단계] 버튼 누르면 번쩍거리며 미쳐 날뛰는 놀리기 화면 -->
    <div id="prank-screen">
        <div class="emoji-bomb">🚨 낚였다 바보야!! 🚨</div>

        <h1 class="shake-text">
            속았지 황정민?!<br>
            방명록 낚시 성공<br>
            ㅋㅋㅋ 대성공 ㅋㅋ
        </h1>

        <div class="prank-desc">
            진짜 방명록에 글 쓰는 줄 알았지?<br>
            <span style="color: #ff0055; background: #fff; padding: 2px 8px; border-radius: 4px;">황정민 지금 동공지진 옴
                🫵😂</span><br>
            오늘 간식은 무조건 네가 쏜다!
        </div>

        <button class="btn-retry" onclick="alert('도망갈 수 없습니다 ㅋㅋㅋ 당장 커피 쏴~~~')">
            속은 거 쿨하게 인정하기
        </button>
    </div>

    <script>
        function triggerPrank() {
            // 1. 위장 화면 숨기고 미친 놀리기 화면 출력
            document.getElementById('invitation-screen').style.display = 'none';
            document.getElementById('prank-screen').style.display = 'flex';

            // 2. 사방에서 폭죽 난사하기
            var duration = 6 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 15,
                    angle: 60,
                    spread: 80,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 15,
                    angle: 120,
                    spread: 80,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>

</html>
